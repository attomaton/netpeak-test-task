name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: Встановити Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Встановити залежності
        run: python -m pip install -r requirements.txt

      - name: Перевірити синтаксис
        run: python -m compileall -q src

      - name: Запустити тести
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: Зібрати Docker-образ
        run: docker build --pull -t request-classifier:ci .

      - name: Перевірити запуск Python у контейнері
        run: docker run --rm request-classifier:ci python -m compileall -q src
